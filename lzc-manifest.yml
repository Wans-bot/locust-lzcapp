application:
  subdomain: locust
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://locust.cloud.lazycat.app.locust.lzcapp:8089
      fix_websocket_header: true
  health_check:
    test_url: http://locust.cloud.lazycat.app.locust.lzcapp:8089/
    start_period: 120s
services:
  locust:
    # upstream: docker.io/locustio/locust:2.47.0
    image: registry.lazycat.cloud/wans/locustio/locust:8ee65ac2ee5ef599
    entrypoint: /bin/sh
    command: /lzcapp/pkg/content/entrypoint.sh
